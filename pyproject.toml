[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worky"
version = "0.2.0"
description = "Workspaces declarativos en terminal mediante el lenguaje .worky"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "elfrask", email = "elfraskodev@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Terminals",
]
dependencies = []

[project.optional-dependencies]
cli = [
    "textual>=0.80",
    "pyte>=0.8",
    "pywinpty>=2.0; sys_platform == 'win32'",
]
dev = ["pytest>=8"]

[project.scripts]
worky = "worky.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
